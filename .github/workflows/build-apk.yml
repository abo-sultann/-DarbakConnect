name: Build DarbakConnect APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: darbak-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/darbak-connect-stable.jks.b64 > app/darbak-connect-stable.jks
          chmod 600 app/darbak-connect-stable.jks
          keytool -list -keystore app/darbak-connect-stable.jks -storepass android -alias darbakconnect >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Run lint
        run: gradle --no-daemon :app:lintRelease

      - name: Name APK by version
        id: apk
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          APK_NAME="DarbakConnect-v${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 1
